<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONIC: SECRET ADVENTURE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: monospace;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(#168bd4 0%, #4fc8ef 60%, #73c94b 60%, #43a83d 100%);

    overflow: hidden;
}

.sun {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #ffe34d;
    top: 12%;
    right: 12%;
    box-shadow: 0 0 0 8px rgba(255,255,255,.15);
}

.cloud {
    position: absolute;
    width: 130px;
    height: 30px;
    background: white;
    border-radius: 30px;
    opacity: .8;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 15px;
    bottom: 5px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    bottom: 0;
}

.cloud1 {
    top: 18%;
    left: 10%;
}

.cloud2 {
    top: 35%;
    right: 18%;
    transform: scale(.7);
}

.logo {
    position: relative;
    z-index: 2;
    text-align: center;
    transform: skew(-7deg);
}

.logo h1 {
    margin: 0;

    font-family: Arial, sans-serif;
    font-size: clamp(75px, 14vw, 170px);
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -12px;

    color: #fff;

    text-shadow:
        5px 5px 0 #e8b91b,
        10px 10px 0 #0865a5,
        15px 15px 0 #003b69;
}

.logo h2 {
    margin-top: -15px;

    font-family: Arial, sans-serif;
    font-size: clamp(20px, 4vw, 45px);
    letter-spacing: 8px;
    color: white;

    text-shadow:
        3px 3px #075b91;
}

.startButton {
    position: relative;
    z-index: 3;

    margin-top: 50px;

    padding: 15px 45px;

    border: 4px solid white;
    border-radius: 6px;

    background: #075fa5;
    color: white;

    font-family: monospace;
    font-size: 24px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 0 #003c69,
        0 0 20px rgba(0,0,0,.3);

    transition: .12s;
}

.startButton:hover {
    background: #0b8be0;
    transform: scale(1.08);
}

.startButton:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #003c69;
}

.hint {
    position: absolute;
    bottom: 25px;
    color: white;
    opacity: .8;
    font-size: 12px;
    z-index: 3;
}

#game {
    display: none;
}

#levelText {
    position: fixed;
    z-index: 5;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-family: Arial, sans-serif;
    font-size: clamp(30px, 7vw, 80px);
    font-weight: 900;
    font-style: italic;

    text-shadow:
        4px 4px #075b91;

    pointer-events: none;

    opacity: 0;
}

@keyframes zoneIntro {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
    }

    25% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

.zoneIntro {
    animation: zoneIntro 2.5s forwards;
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="logo">

        <h1>SONIC</h1>

        <h2>SECRET ADVENTURE</h2>

    </div>

    <button class="startButton" onclick="startGame()">
        ▶ PRESS START
    </button>

    <div class="hint">
        A SECRET ADVENTURE IS WAITING...
    </div>

</div>


<!-- =========================
     GAME
========================= -->

<canvas id="game"></canvas>

<div id="levelText">
    GREEN HILL ZONE
</div>


<script>

/* ==================================================
   CANVAS
================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let W;
let H;

function resize() {

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


/* ==================================================
   GAME STATE
================================================== */

let gameRunning = false;

let cameraX = 0;

let score = 0;

let rings = 0;

let keys = {};


/* ==================================================
   PLAYER
================================================== */

const player = {

    x: 120,
    y: 300,

    width: 38,
    height: 48,

    vx: 0,
    vy: 0,

    speed: 5,

    jump: 12,

    grounded: false

};


/* ==================================================
   LEVEL
================================================== */

const levelWidth = 5200;

const groundY = 430;


/* ==================================================
   RINGS
================================================== */

const ringObjects = [

    {x: 450, y: 350, collected:false},
    {x: 500, y: 350, collected:false},
    {x: 550, y: 350, collected:false},

    {x: 850, y: 300, collected:false},
    {x: 900, y: 300, collected:false},
    {x: 950, y: 300, collected:false},

    {x: 1350, y: 350, collected:false},
    {x: 1400, y: 350, collected:false},
    {x: 1450, y: 350, collected:false},

    {x: 1900, y: 280, collected:false},
    {x: 1950, y: 280, collected:false},
    {x: 2000, y: 280, collected:false},

    {x: 2500, y: 340, collected:false},
    {x: 2550, y: 340, collected:false},
    {x: 2600, y: 340, collected:false},

    {x: 3200, y: 300, collected:false},
    {x: 3250, y: 300, collected:false},
    {x: 3300, y: 300, collected:false},

    {x: 4000, y: 350, collected:false},
    {x: 4050, y: 350, collected:false},
    {x: 4100, y: 350, collected:false}

];


/* ==================================================
   PLATFORMS
================================================== */

const platforms = [

    {x: 700, y: 350, w: 180, h: 25},

    {x: 1100, y: 320, w: 200, h: 25},

    {x: 1750, y: 300, w: 250, h: 25},

    {x: 2300, y: 350, w: 220, h: 25},

    {x: 2900, y: 290, w: 250, h: 25},

    {x: 3600, y: 330, w: 250, h: 25}

];


/* ==================================================
   INPUT
================================================== */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {

        e.preventDefault();

    }

});


window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* ==================================================
   START
================================================== */

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    canvas.style.display = "block";

    gameRunning = true;

    player.x = 120;
    player.y = 300;

    cameraX = 0;

    showZoneIntro();

    requestAnimationFrame(gameLoop);

}


/* ==================================================
   ZONE INTRO
================================================== */

function showZoneIntro() {

    const text = document.getElementById("levelText");

    text.classList.remove("zoneIntro");

    void text.offsetWidth;

    text.classList.add("zoneIntro");

}


/* ==================================================
   UPDATE
================================================== */

function update() {

    if (!gameRunning) return;


    /* MOVE RIGHT */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.vx += .5;

    }


    /* MOVE LEFT */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.vx -= .5;

    }


    /* FRICTION */

    player.vx *= .88;


    /* SPEED LIMIT */

    if (player.vx > player.speed)
        player.vx = player.speed;

    if (player.vx < -player.speed)
        player.vx = -player.speed;


    /* JUMP */

    if (
        (
            keys[" "] ||
            keys["arrowup"] ||
            keys["w"]
        )
        &&
        player.grounded
    ) {

        player.vy = -player.jump;

        player.grounded = false;

    }


    /* GRAVITY */

    player.vy += .6;


    player.x += player.vx;
    player.y += player.vy;


    /* GROUND */

    player.grounded = false;

    if (
        player.y + player.height >= groundY
    ) {

        player.y =
            groundY - player.height;

        player.vy = 0;

        player.grounded = true;

    }


    /* PLATFORMS */

    for (const p of platforms) {

        if (
            player.x + player.width > p.x &&
            player.x < p.x + p.w &&
            player.y + player.height >= p.y &&
            player.y + player.height <= p.y + 25 &&
            player.vy >= 0
        ) {

            player.y =
                p.y - player.height;

            player.vy = 0;

            player.grounded = true;

        }

    }


    /* LEVEL LIMITS */

    if (player.x < 0)
        player.x = 0;

    if (player.x > levelWidth - player.width)
        player.x = levelWidth - player.width;


    /* CAMERA */

    cameraX =
        player.x - W * .35;

    if (cameraX < 0)
        cameraX = 0;

    if (cameraX > levelWidth - W)
        cameraX = levelWidth - W;


    /* COLLECT RINGS */

    for (const ring of ringObjects) {

        if (ring.collected)
            continue;

        const dx =
            player.x + player.width / 2 - ring.x;

        const dy =
            player.y + player.height / 2 - ring.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < 35) {

            ring.collected = true;

            rings++;

            score += 100;

        }

    }

}


/* ==================================================
   DRAW BACKGROUND
================================================== */

function drawBackground() {

    /* SKY */

    ctx.fillStyle = "#58c9ff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.fillStyle = "#ffe45c";

    ctx.beginPath();

    ctx.arc(
        W - 100,
        100,
        65,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* DISTANT HILLS */

    ctx.fillStyle = "#39a94b";

    for (
        let x = -500 - cameraX * .25;
        x < levelWidth;
        x += 500
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            groundY + 30,
            280,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* CLOUDS */

    ctx.fillStyle = "rgba(255,255,255,.8)";

    for (
        let x = -200 - cameraX * .15;
        x < levelWidth;
        x += 650
    ) {

        ctx.fillRect(
            x,
            90,
            130,
            25
        );

        ctx.beginPath();

        ctx.arc(
            x + 35,
            90,
            35,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            x + 90,
            90,
            45,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* ==================================================
   DRAW GROUND
================================================== */

function drawGround() {

    ctx.fillStyle = "#45ad3e";

    ctx.fillRect(
        0,
        groundY,
        W,
        H - groundY
    );


    /* GRASS */

    ctx.fillStyle = "#70d94c";

    ctx.fillRect(
        0,
        groundY,
        W,
        12
    );


    /* DIRT */

    ctx.fillStyle = "#8a582b";

    ctx.fillRect(
        0,
        groundY + 12,
        W,
        35
    );


    /* CHECKER PATTERN */

    for (
        let x = -cameraX % 50;
        x < W;
        x += 50
    ) {

        for (
            let y = groundY + 47;
            y < H;
            y += 50
        ) {

            ctx.fillStyle =
                ((Math.floor((x + cameraX) / 50) +
                Math.floor(y / 50)) % 2 === 0)
                ? "#8a582b"
                : "#70451f";

            ctx.fillRect(
                x,
                y,
                50,
                50
            );

        }

    }

}


/* ==================================================
   DRAW PLATFORMS
================================================== */

function drawPlatforms() {

    for (const p of platforms) {

        const x =
            p.x - cameraX;

        ctx.fillStyle = "#45ad3e";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle = "#70d94c";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            7
        );

        ctx.fillStyle = "#8a582b";

        ctx.fillRect(
            x,
            p.y + 7,
            p.w,
            p.h - 7
        );

    }

}


/* ==================================================
   DRAW RINGS
================================================== */

function drawRings() {

    for (const ring of ringObjects) {

        if (ring.collected)
            continue;

        const x =
            ring.x - cameraX;

        const y =
            ring.y;

        ctx.strokeStyle = "#ffd92f";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            15,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.strokeStyle = "#fff4a3";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            15,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

}


/* ==================================================
   DRAW SONIC
================================================== */

function drawSonic() {

    const x =
        player.x - cameraX;

    const y =
        player.y;


    ctx.save();

    ctx.translate(
        x + player.width / 2,
        y + player.height / 2
    );


    /* BODY */

    ctx.fillStyle = "#0879d1";

    ctx.beginPath();

    ctx.arc(
        0,
        5,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SPIKES */

    ctx.beginPath();

    ctx.moveTo(-10, -10);
    ctx.lineTo(-32, -20);
    ctx.lineTo(-18, 0);

    ctx.moveTo(-15, -3);
    ctx.lineTo(-38, 2);
    ctx.lineTo(-17, 10);

    ctx.moveTo(0, -13);
    ctx.lineTo(-10, -35);
    ctx.lineTo(8, -18);

    ctx.fill();


    /* FACE */

    ctx.fillStyle = "#ffd2a0";

    ctx.beginPath();

    ctx.ellipse(
        8,
        8,
        16,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* EYE */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.ellipse(
        10,
        -2,
        6,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        12,
        -2,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* NOSE */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        20,
        8,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SHOES */

    ctx.fillStyle = "#e52c2c";

    ctx.fillRect(
        -20,
        23,
        22,
        8
    );

    ctx.fillRect(
        7,
        23,
        22,
        8
    );


    ctx.restore();

}


/* ==================================================
   HUD
================================================== */

function drawHUD() {

    ctx.fillStyle = "white";

    ctx.font = "bold 20px monospace";

    ctx.fillText(
        "SCORE",
        25,
        35
    );

    ctx.fillText(
        String(score).padStart(6, "0"),
        25,
        60
    );


    ctx.fillText(
        "RINGS",
        25,
        90
    );

    ctx.fillText(
        String(rings).padStart(2, "0"),
        25,
        115
    );


    ctx.fillText(
        "ZONE 1",
        W - 120,
        35
    );

}


/* ==================================================
   FINISH
================================================== */

function checkFinish() {

    if (player.x > levelWidth - 300) {

        gameRunning = false;

        setTimeout(() => {

            alert(
                "🏁 LEVEL COMPLETE!\n\n" +
                "You reached the end of Green Hill Zone!"
            );

        }, 100);

    }

}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop() {

    if (!gameRunning)
        return;

    update();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawGround();

    drawPlatforms();

    drawRings();

    drawSonic();

    drawHUD();

    checkFinish();

    requestAnimationFrame(gameLoop);

}

</script>

</body>
</html>
