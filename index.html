<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños falso Lu!</title>
    <style>
        /* Estilos generales y fondo de cielo */
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Azul cielo */
            font-family: 'Courier New', Courier, monospace; /* Fuente estilo retro/pixel */
            overflow: hidden; /* Evita barras de desplazamiento */
            text-align: center;
            color: white;
            text-shadow: 3px 3px 0 #000; /* Sombra para que parezca de 16-bits */
        }

        /* El suelo de Green Hill Zone */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            /* Patrón de cuadros marrones */
            background:
                linear-gradient(135deg, #8B4513 25%, transparent 25%) -50px 0,
                linear-gradient(225deg, #8B4513 25%, transparent 25%) -50px 0,
                linear-gradient(315deg, #8B4513 25%, transparent 25%),
                linear-gradient(45deg, #8B4513 25%, transparent 25%);
            background-size: 100px 100px;
            background-color: #D2691E;
            border-top: 25px solid #32CD32; /* El pasto verde */
        }

        /* Contenedor del texto */
        .container {
            position: relative;
            z-index: 10;
            margin-top: 10vh;
            padding: 0 20px;
        }

        h1 {
            font-size: 3.5rem;
            color: #FFD700; /* Dorado como los anillos */
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* El botón de Start */
        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.8rem;
            background-color: #FF0000; /* Rojo como los zapatos de Sonic */
            color: white;
            border: 4px solid white;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #8B0000;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #8B0000;
        }

        /* Mensaje oculto que aparece al dar click */
        #hiddenMessage {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            margin: 20px auto;
            border: 3px solid #FFD700;
        }

        .sonic-gif {
            width: 150px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">¡LEVEL UP!</h1>
        <p id="subtitle" style="font-size: 1.5rem;">¿Listo para el siguiente nivel?</p>
        
        <button class="btn" id="startBtn">START</button>
        
        <!-- Este mensaje está oculto hasta que presiona START -->
        <div id="hiddenMessage">
            <h2>Simplemente es una prueba ;P </h2>
            <p>Tienes la dicha de disfurtar dos cumpleaños :D </p>
            <!-- GIF de Sonic corriendo -->
            <img src="https://media.giphy.com/media/hDFyKOU28434K/giphy.gif" alt="Sonic Running" class="sonic-gif">
        </div>
    </div>

    <!-- El suelo dibujado con CSS -->
    <div class="ground"></div>

    <script>
        // Lógica para el botón START
        document.getElementById('startBtn').addEventListener('click', function() {
            // Ocultar el botón y el subtítulo
            this.style.display = 'none';
            document.getElementById('subtitle').style.display = 'none';
            
            // Mostrar el mensaje secreto
            document.getElementById('hiddenMessage').style.display = 'block';
            
            // Cambiar el título principal
            document.getElementById('title').innerText = "¡ACTO COMPLETADO!";
        });
    </script>
</body>
</html>
