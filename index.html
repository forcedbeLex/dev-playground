<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz No Cumpleaños!</title>
    <style>
        /* Estilos generales y fondo de cielo */
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Azul cielo */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }

        /* El suelo de Green Hill Zone */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background:
                linear-gradient(135deg, #8B4513 25%, transparent 25%) -50px 0,
                linear-gradient(225deg, #8B4513 25%, transparent 25%) -50px 0,
                linear-gradient(315deg, #8B4513 25%, transparent 25%),
                linear-gradient(45deg, #8B4513 25%, transparent 25%);
            background-size: 100px 100px;
            background-color: #D2691E;
            border-top: 25px solid #32CD32;
            z-index: 1;
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 10;
            margin-top: 10vh;
            padding: 0 20px;
        }

        h1 {
            font-size: 3.5rem;
            color: #FFD700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* Botones generales */
        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.8rem;
            background-color: #FF0000;
            color: white;
            border: 4px solid white;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #8B0000;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #8B0000;
        }

        /* Estilos de la Trivia */
        #triviaSection {
            display: none;
            background: rgba(0, 0, 100, 0.7);
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            margin: 20px auto;
            border: 4px solid #FFD700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background-color: #0000CD;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            padding: 15px 10px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        .option-btn:hover {
            background-color: #4169E1;
        }

        /* Mensaje final */
        #finalMessage {
            display: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            margin: 20px auto;
            border: 4px solid #32CD32;
        }

        .sonic-gif {
            width: 150px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="mainTitle">Feliz no cumpleaños o.o </h1>
        <p id="subtitle" style="font-size: 1.5rem;">Veamos si puedes contestar esta pequeña trivia </p>
        <p id="subtitle" style="font-size: 1.0rem;">amable recordatorio que no se absolutamente nada de este mundo n.n </p>
        
        <!-- Pantalla de Inicio -->
        <button class="btn" id="startBtn">START</button>
        
        <!-- Sección de Trivia -->
        <div id="triviaSection">
            <h2 id="questionText">Pregunta aquí</h2>
            <div class="options-grid" id="optionsContainer">
                <!-- Los botones se generarán con JavaScript -->
            </div>
        </div>

        <!-- Mensaje Final Oculto -->
        <div id="finalMessage">
            <h2>¡Feliz Cumpleaños falso Lu >.o!</h2>
            <p>¡Ya casi 23 :D! un regalo bastante lindo vendra en tu verdadero cumple, esto solo era un previa :).</p>
            <img src="https://media.giphy.com/media/hDFyKOU28434K/giphy.gif" alt="Sonic Running" class="sonic-gif">
        </div>
    </div>

    <!-- El suelo dibujado con CSS -->
    <div class="ground"></div>

    <script>
        // --- PREGUNTAS DE LA TRIVIA ---
        const questions = [
            {
                question: "¿Cómo se llama originalmente Sonic?",
                options: ["Siempre se llamo Sonic", "Mr. Needlemouse", "Mr. Spikes", "Brody"],
                correctAnswer: 1 // Mr. Needlemouse (la posición 1 en el arreglo, ya que empieza a contar desde 0)
            },
            {
                question: "¿En qué juego debutó oficialmente Blaze the Cat?",
                options: ["Sonic Adventure", "Sonic Heroes", "Sonic Rush", "Sonic the Hedgehog"],
                correctAnswer: 2 // Sonic Rush
            },
            {
                question: "¿Cuál es el verdadero nombre del villano de Sonic?",
                options: ["Dr. Robotnik", "Dr. Wily", "Bowser", "King K. Rool"],
                correctAnswer: 0 // Dr. Robotnik / Eggman
            },
            {
                question: "¿Cuál es el verdadero enemigo nocturno de Lu?",
                options: ["El sistema capitalista", "Las entidades del departamento", "Los mosquitos hembra que quieren su sangre", "Spoilers en plataformas digitales"],
                correctAnswer: 2 // Los mosquitos hembra que quieren su sangre
            }
        ];

        let currentQuestionIndex = 0;

        // Elementos del DOM
        const startBtn = document.getElementById('startBtn');
        const subtitle = document.getElementById('subtitle');
        const triviaSection = document.getElementById('triviaSection');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const finalMessage = document.getElementById('finalMessage');
        const mainTitle = document.getElementById('mainTitle');

        // Iniciar el juego
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            subtitle.style.display = 'none';
            triviaSection.style.display = 'block';
            loadQuestion();
        });

        // Cargar la pregunta actual
        function loadQuestion() {
            const currentQ = questions[currentQuestionIndex];
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = ''; // Limpiar botones anteriores

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = option;
                btn.addEventListener('click', () => checkAnswer(index));
                optionsContainer.appendChild(btn);
            });
        }

        // Verificar la respuesta
        function checkAnswer(selectedIndex) {
            const currentQ = questions[currentQuestionIndex];
            
            if (selectedIndex === currentQ.correctAnswer) {
                // Respuesta correcta
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    loadQuestion(); // Siguiente pregunta
                } else {
                    showFinalMessage(); // Ganó el juego
                }
            } else {
                // Respuesta incorrecta
                alert("Lu? tu equivocandote? :O de seguro fue error de la pagina n.n");
            }
        }

        // Mostrar el regalo final
        function showFinalMessage() {
            triviaSection.style.display = 'none';
            finalMessage.style.display = 'block';
            mainTitle.innerText = "¡Si sabias todaaaaas u.u!";
        }
    </script>
</body>
</html>
